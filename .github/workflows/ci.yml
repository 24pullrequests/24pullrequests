name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER tfpullrequests WITH SUPERUSER PASSWORD 'postgres'"
      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          bundler-cache: true
      - name: Run tests
        env:
          RAILS_ENV: test
          TFPULLREQUESTS_DATABASE_PASSWORD: postgres
          TFPULLREQUESTS_DATABASE_USER: tfpullrequests
        run: bundle exec rake db:create db:migrate spec
